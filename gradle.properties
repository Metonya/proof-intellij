group = dev.proofjava.intellij
pluginVersion = 0.1.0

# proof-vscode's own package.json pins engine versions rather than trusting
# "latest" — same discipline here: every version in this project is a
# verified-real number, not a guess (see Yol-Haritasi-TODO.md plan for the
# session's own verification of each one against JetBrains' live docs).
platformVersion = 2026.2.2
platformSinceBuild = 262
kotlinVersion = 2.3.20
intellijPlatformPluginVersion = 2.18.1

kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true

# Forces the Gradle daemon JVM's locale to en-US, regardless of the host
# OS's own locale. Real bug hit on this machine (Turkish Windows):
# intellij-platform-gradle-plugin's plugin-structure library upper-cases a
# service-type string ("application" -> "APPLICATION") before an
# Enum.valueOf lookup; under a Turkish default locale, `"application".toUpperCase()`
# produces "APPLİCATİON" (dotted capital İ, not "APPLICATION"), so the
# lookup throws IllegalArgumentException while indexing the bundled IDE's
# own plugins for `:core:test`/`runIde`. Not a bug in this project's code -
# the classic JVM "Turkish locale" i/İ problem in a third-party dependency.
org.gradle.jvmargs = -Duser.language=en -Duser.country=US
